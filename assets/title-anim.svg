<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <style>
      .title { font: 700 48px 'Inter', sans-serif; fill: url(#g); }
      .subtitle { font: 400 18px 'Inter', sans-serif; fill: #64748b; }
      .shine { animation: move 3s linear infinite; }
      @keyframes move { 0% { transform: translateX(-120%);} 100% { transform: translateX(120%);} }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="transparent"/>
  <g transform="translate(40,70)">
    <text class="title">VishTech AI Translator</text>
    <g transform="translate(0,40)">
      <text class="subtitle">Fast — Accurate — Multilingual</text>
    </g>
    <g transform="translate(0,78)">
      <rect width="600" height="6" rx="6" fill="#e6eef9"/>
      <rect class="shine" width="180" height="6" rx="6" fill="#3b82f6"/>
    </g>
  </g>
</svg>
