<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#93c5fd" />
    </marker>
  </defs>
  <style>
    .node { fill: #fff; stroke: #c7d2fe; stroke-width: 2; rx:10; }
    .label { font: 700 14px 'Inter', sans-serif; fill: #0f172a; }
    .sublabel { font: 500 12px 'Inter', sans-serif; fill: #475569; }
    .link { stroke: #bfdbfe; stroke-width: 3; stroke-linecap: round; fill: none; }
  </style>

  <!-- Root (centered) -->
  <g id="root" transform="translate(290,28)">
    <rect class="node" width="320" height="56"/>
    <text class="label" x="160" y="36" text-anchor="middle">VishTech AI Translator</text>
  </g>

  <!-- Level 1 nodes -->
  <g id="level1">
    <!-- Translation Engine -->
    <g id="translation" transform="translate(110,140)">
      <rect class="node" width="220" height="48"/>
      <text class="label" x="110" y="32" text-anchor="middle">Translation Engine</text>
    </g>

    <!-- Speech I/O -->
    <g id="speech" transform="translate(570,140)">
      <rect class="node" width="220" height="48"/>
      <text class="label" x="110" y="32" text-anchor="middle">Speech I/O</text>
    </g>
  </g>

  <!-- Level 2 nodes under Translation Engine -->
  <g id="translation_children">
    <g transform="translate(40,260)">
      <rect class="node" width="160" height="44"/>
      <text class="sublabel" x="80" y="28" text-anchor="middle">Auto-Detect</text>
    </g>
    <g transform="translate(220,260)">
      <rect class="node" width="180" height="44"/>
      <text class="sublabel" x="90" y="28" text-anchor="middle">Translation APIs</text>
    </g>
  </g>

  <!-- Level 2 nodes under Speech I/O -->
  <g id="speech_children">
    <g transform="translate(500,260)">
      <rect class="node" width="160" height="44"/>
      <text class="sublabel" x="80" y="28" text-anchor="middle">STT (Mic)</text>
    </g>
    <g transform="translate(680,260)">
      <rect class="node" width="160" height="44"/>
      <text class="sublabel" x="80" y="28" text-anchor="middle">TTS (gTTS / Cloud)</text>
    </g>
  </g>

  <!-- Connection lines (explicit coordinates for clarity) -->
  <!-- Root bottom center -->
  <path class="link" d="M450 84 C450 120, 190 120, 220 140" marker-end="url(#arrow)" />
  <path class="link" d="M450 84 C450 120, 680 120, 680 140" marker-end="url(#arrow)" />

  <!-- From Translation Engine to its children -->
  <path class="link" d="M220 188 L120 260" marker-end="url(#arrow)" />
  <path class="link" d="M340 188 L320 260" marker-end="url(#arrow)" />

  <!-- From Speech I/O to its children -->
  <path class="link" d="M680 188 L580 260" marker-end="url(#arrow)" />
  <path class="link" d="M680 188 L760 260" marker-end="url(#arrow)" />

  <!-- Footer caption -->
  <text x="20" y="480" font-family="Inter, sans-serif" font-size="12" fill="#64748b">Feature flow — clear connections from root to modules</text>
</svg>
